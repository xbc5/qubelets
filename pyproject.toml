[project]
name = "qubelets"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10.6",
    "tomlkit>=0.14.0",
]

[project.scripts]
asn-to-ip = "qubelets.cli.domu.asn_to_ip:main"
qfw = "qubelets.cli.admin.qfw:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qubelets"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
