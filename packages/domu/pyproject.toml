[project]
name = "qubelets-domu"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "qubelets-common==0.1.0",
]

[project.scripts]
asn-to-ip = "qubelets.cli.domu.asn_to_ip:main"

[tool.uv.sources]
qubelets-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qubelets"]
